<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --red: #ff1025;
        --background: #080000;
        --text-muted: #927e80;
    }

    html {
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        background:
            radial-gradient(
                ellipse at 50% 42%,
                rgba(130, 0, 12, 0.25),
                transparent 58%
            ),
            linear-gradient(
                180deg,
                #080000,
                #100000 55%,
                #050000
            );
        overflow-x: hidden;
    }

    .background-glow {
        position: fixed;
        width: 300px;
        height: 300px;
        top: 25%;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 0, 25, 0.10);
        filter: blur(100px);
        border-radius: 50%;
        pointer-events: none;
    }

    .particles {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
    }

    .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #ff2438;
        opacity: 0.35;
        animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0);
            opacity: 0.15;
        }

        50% {
            transform: translateY(-25px);
            opacity: 0.65;
        }
    }

    .container {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        min-height: 100svh;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px 20px;
    }

    .card {
        width: 100%;
        max-width: 390px;
        text-align: center;
        padding: 25px 8px;
    }

    .brand {
        font-size: clamp(15px, 4.5vw, 21px);
        font-weight: 900;
        letter-spacing: 0.5px;
        line-height: 1.5;
        color: #ff2638;
        text-shadow:
            0 0 10px rgba(255, 0, 20, 0.45),
            0 0 25px rgba(255, 0, 20, 0.18);
        margin-bottom: 32px;
        white-space: nowrap;
    }

    .profile-wrapper {
        position: relative;
        width: 100px;
        height: 100px;
        margin: 0 auto 35px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .profile-wrapper::before,
    .profile-wrapper::after {
        content: "";
        position: absolute;
        inset: -7px;
        border: 1px solid rgba(255, 30, 45, 0.8);
        border-radius: 50%;
        animation: rotate 7s linear infinite;
    }

    .profile-wrapper::after {
        inset: -14px;
        border-color: rgba(255, 30, 45, 0.35);
        animation-direction: reverse;
        animation-duration: 10s;
    }

    @keyframes rotate {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    .profile-image {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid #d50018;
        object-fit: cover;
        background: #180507;
        box-shadow: 0 0 25px rgba(255, 0, 25, 0.35);
    }

    .fallback-profile {
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: 900;
        color: #ff2638;
    }

    .main-title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1px;
        line-height: 1.5;
        margin-bottom: 12px;
    }

    .highlight {
        color: #ff2638;
    }

    .description {
        max-width: 300px;
        margin: 0 auto 28px;
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.8;
    }

    .join-button {
        width: 100%;
        min-height: 58px;
        padding: 15px 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-radius: 40px;
        text-decoration: none;
        color: white;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.3px;
        background: linear-gradient(
            110deg,
            #ff1025 0%,
            #e00017 55%,
            #99000d 100%
        );
        box-shadow:
            0 0 20px rgba(255, 0, 25, 0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.15);
        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease;
        animation: pulse 2.5s infinite;
    }

    .join-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 32px rgba(255, 0, 25, 0.55);
    }

    .join-button:active {
        transform: scale(0.97);
    }

    .telegram-icon {
        width: 19px;
        height: 19px;
        flex-shrink: 0;
        fill: currentColor;
    }

    @keyframes pulse {
        0%, 100% {
            box-shadow: 0 0 15px rgba(255, 0, 25, 0.22);
        }

        50% {
            box-shadow: 0 0 27px rgba(255, 0, 25, 0.45);
        }
    }

    .subtitle {
        margin-top: 23px;
        color: #a98a8d;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 2px;
    }

    .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 22px;
        padding: 9px 14px;
        border: 1px solid rgba(255, 30, 45, 0.2);
        border-radius: 30px;
        background: rgba(255, 0, 20, 0.04);
        color: #c8a8aa;
        font-size: 10px;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff2638;
        box-shadow: 0 0 8px rgba(255, 30, 45, 0.7);
    }

    .footer {
        margin-top: 55px;
        color: #614548;
        font-size: 10px;
        letter-spacing: 1px;
        line-height: 1.8;
    }

    .footer a {
        color: #b64a53;
        text-decoration: none;
    }

    @media (max-width: 360px) {
        .brand {
            font-size: 14px;
            letter-spacing: 0;
        }

        .main-title {
            font-size: 19px;
        }

        .join-button {
            font-size: 10px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            scroll-behavior: auto !important;
        }
    }
</style>

<script>
    // Background particles
    const particles = document.getElementById("particles");

    for (let i = 0; i < 35; i++) {
        const particle = document.createElement("span");

        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.top = Math.random() * 100 + "%";
        particle.style.animationDelay = Math.random() * 6 + "s";
        particle.style.animationDuration =
            (4 + Math.random() * 5) + "s";

        particles.appendChild(particle);
    }

    // Current year
    document.getElementById("year").textContent =
        new Date().getFullYear();

    // Standard Meta Subscribe event when the Telegram button is clicked.
    // This tracks the click, not a verified Telegram subscription.
    document.getElementById("telegramJoinButton")
        .addEventListener("click", function () {
            if (typeof window.fbq === "function") {
                fbq('track', 'Subscribe');
            }
        });
</script>
